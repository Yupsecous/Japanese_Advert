name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Installs every workspace (web, backend, shared, android). The Android
      # package pulls in React Native, so this is the slow step — the npm
      # cache above keeps repeat runs reasonable.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck (web)
        run: npm run typecheck

      - name: Typecheck (backend)
        run: npm run typecheck --workspace=@advert/backend

      - name: Unit tests
        run: npm test

      # Catches anything that typechecks but fails to bundle.
      - name: Build (web)
        run: npm run build
