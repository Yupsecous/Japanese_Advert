<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary -->
    <title>Personify Ads — AI Ad Generator for Copy, Images &amp; Video</title>
    <meta
      name="description"
      content="Turn a three-line brief into a complete ad campaign: copy, imagery, landing page, voiceover and video, generated by AI in minutes. No prompt writing. Six languages."
    />
    <link rel="canonical" href="https://personify.my/" />
    <meta name="theme-color" content="#1a1d23" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph (Facebook, LinkedIn, Slack, WhatsApp, Discord) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Personify Ads" />
    <meta property="og:url" content="https://personify.my/" />
    <meta property="og:title" content="Personify Ads — AI Ad Generator" />
    <meta
      property="og:description"
      content="Three lines in, a full campaign out: copy, imagery, landing page, voiceover and video. Refine everything in plain language — never write a prompt."
    />
    <!-- NOTE: /og-image.png must be a 1200x630 PNG. Until it exists, link
         previews still render title + description, just without the image. -->
    <meta property="og:image" content="https://personify.my/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Personify Ads — AI ad generation platform" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ja_JP" />
    <meta property="og:locale:alternate" content="pt_PT" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="de_DE" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Personify Ads — AI Ad Generator" />
    <meta
      name="twitter:description"
      content="Three lines in, a full campaign out: copy, imagery, landing page, voiceover and video. Refine in plain language — never write a prompt."
    />
    <meta name="twitter:image" content="https://personify.my/og-image.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Personify Ads",
        "url": "https://personify.my/",
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "Advertising &amp; Marketing",
        "operatingSystem": "Web browser, Android",
        "description": "AI ad generation platform. A three-line brief produces campaign copy, imagery, a landing page, a voiceover and video, with every step refinable in plain language.",
        "inLanguage": ["en", "ja", "pt", "es", "fr", "de"],
        "featureList": [
          "AI ad copy generation",
          "AI image generation",
          "AI voiceover and script writing",
          "AI landing page generation",
          "Campaign video composition",
          "Meta and X ad format export",
          "Per-recipient audience personalization"
        ],
        "offers": [
          {
            "@type": "Offer",
            "name": "Free",
            "price": "0",
            "priceCurrency": "USD"
          },
          {
            "@type": "Offer",
            "name": "Pro",
            "price": "19",
            "priceCurrency": "USD"
          },
          {
            "@type": "Offer",
            "name": "Ultra",
            "price": "49",
            "priceCurrency": "USD"
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-canvas text-ink antialiased">
    <div id="root"></div>

    <!-- Crawlers and social scrapers that do not execute JavaScript see only
         an empty #root. This gives them real, accurate content to index. -->
    <noscript>
      <h1>Personify Ads — AI ad generation</h1>
      <p>
        Personify Ads turns a three-line brief (product, audience, angle) into a complete
        advertising campaign: headline and body copy, hero imagery, a spoken script, a
        synthesized voiceover, a working landing page, and campaign video ready for Meta
        and X.
      </p>
      <p>
        Every stage returns two variants. You pick one or describe the change you want in
        plain language — "warmer, less corporate", "lighter background, more energy" — and
        the platform translates that into the technical parameters each AI model needs. You
        never write a prompt.
      </p>
      <h2>What it generates</h2>
      <ul>
        <li>Ad copy — headline, caption and call to action</li>
        <li>Hero imagery generated from your approved copy</li>
        <li>A 20–40 second voiceover script, with a voice you choose</li>
        <li>Synthesized voiceover audio</li>
        <li>A responsive landing page</li>
        <li>Campaign video and Meta / X ad formats</li>
      </ul>
      <p>Available in English, 日本語, Português, Español, Français and Deutsch.</p>
      <p>This application requires JavaScript. Please enable it to continue.</p>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
